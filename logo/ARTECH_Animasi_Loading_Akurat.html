<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTECH Loading Animation Accurate</title>
  <style>
    :root {
      --bg: #ffffff;
      --size: min(84vw, 420px);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #ffffff 0%, #fcfcfc 60%, #f5f7fb 100%);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      display: grid;
      place-items: center;
      gap: 18px;
      padding: 24px;
    }

    .stage {
      position: relative;
      width: var(--size);
      aspect-ratio: 1 / 1;
      isolation: isolate;
    }

    .halo {
      position: absolute;
      inset: 8% 8% 20% 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(254,150,29,.18) 0%, rgba(254,150,29,.09) 35%, rgba(254,150,29,0) 72%);
      filter: blur(16px);
      opacity: 0;
      animation: halo 3.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      image-rendering: auto;
    }

    /* Accurate ring reveal using the original ring image and a conic mask */
    @property --sweep {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }

    .ring {
      --sweep: 0deg;
      opacity: 0;
      transform: scale(0.985);
      -webkit-mask-image: conic-gradient(from -152deg, #000 0deg, #000 var(--sweep), transparent calc(var(--sweep) + 0.8deg), transparent 360deg);
      mask-image: conic-gradient(from -152deg, #000 0deg, #000 var(--sweep), transparent calc(var(--sweep) + 0.8deg), transparent 360deg);
      animation: ringDraw 3.2s cubic-bezier(.45, 0, .2, 1) infinite;
      z-index: 1;
      filter: drop-shadow(0 3px 6px rgba(254,150,29,.15));
    }

    .symbol {
      opacity: 0;
      transform: translateY(22px) scale(.92);
      animation: symbolIn 3.2s cubic-bezier(.22, 1, .36, 1) infinite;
      z-index: 2;
      filter: drop-shadow(0 8px 12px rgba(15,45,103,.10));
    }

    .text {
      opacity: 0;
      transform: translateY(16px) scale(.98);
      animation: textIn 3.2s ease-in-out infinite;
      z-index: 3;
      filter: drop-shadow(0 4px 8px rgba(15,45,103,.10));
    }

    @keyframes ringDraw {
      0%, 6% { opacity: 0; --sweep: 0deg; transform: scale(.985); }
      8% { opacity: 1; }
      36% { opacity: 1; --sweep: 360deg; transform: scale(1); }
      82% { opacity: 1; --sweep: 360deg; transform: scale(1); }
      100% { opacity: 0; --sweep: 360deg; transform: scale(1); }
    }

    @keyframes symbolIn {
      0%, 28% { opacity: 0; transform: translateY(22px) scale(.92); }
      42% { opacity: 1; transform: translateY(-2px) scale(1.01); }
      52%, 82% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(0) scale(1); }
    }

    @keyframes textIn {
      0%, 44% { opacity: 0; transform: translateY(16px) scale(.98); }
      58% { opacity: 1; transform: translateY(-1px) scale(1.005); }
      66%, 82% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(0) scale(1); }
    }

    @keyframes halo {
      0%, 45% { opacity: 0; transform: scale(.78); }
      60% { opacity: .55; transform: scale(1); }
      72% { opacity: .24; transform: scale(.93); }
      82% { opacity: .52; transform: scale(1.01); }
      100% { opacity: 0; transform: scale(1.06); }
    }

    @keyframes finishPulse {
      0%, 58% { opacity: 0; transform: scale(1); }
      68% { opacity: .08; transform: scale(1.016); }
      78% { opacity: .02; transform: scale(.998); }
      84% { opacity: .08; transform: scale(1.012); }
      100% { opacity: 0; transform: scale(1); }
    }
